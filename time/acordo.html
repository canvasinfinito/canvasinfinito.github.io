/* ── A pele Argila (oficina.dart): o escuro é o padrão do app ── */
:root{
  --chao:#000000;--papel:#000000;--papel2:#161615;--papel3:#201F1D;
  --tinta:#FAF9F5;--tinta2:#DDDBD3;--tinta3:#B5B3AA;--traco:#3D3C38;
  --acento:#D97757;--acentoFraco:#23130E;--sobre:#000000;--corp:#93B5D5;--corpFraco:#181D22;
  --bom:#98BC85;--atencao:#EEC780;--erro:#D67E85;
  --sombra:0 1px 0 rgba(255,255,255,.04) inset,0 18px 44px rgba(0,0,0,.5);
  --letra:"Atkinson","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --dado:"CanvasMono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --chao:#F5F4EE;--papel:#FAF9F5;--papel2:#FFFFFF;--papel3:#EFEDE5;
  --tinta:#1F1E1D;--tinta2:#3F3D39;--tinta3:#57554F;--traco:#B6B3A8;
  --acento:#B0552F;--acentoFraco:#F1E5DD;--sobre:#FFFFFF;--corp:#25547D;--corpFraco:#E3EAF1;
  --bom:#365B28;--atencao:#8F6627;--erro:#681A23;
  --sombra:0 1px 2px rgba(0,0,0,.05),0 14px 36px rgba(0,0,0,.07);
  color-scheme:light}}
:root[data-theme="light"]{
  --chao:#F5F4EE;--papel:#FAF9F5;--papel2:#FFFFFF;--papel3:#EFEDE5;
  --tinta:#1F1E1D;--tinta2:#3F3D39;--tinta3:#57554F;--traco:#B6B3A8;
  --acento:#B0552F;--acentoFraco:#F1E5DD;--sobre:#FFFFFF;--corp:#25547D;--corpFraco:#E3EAF1;
  --bom:#365B28;--atencao:#8F6627;--erro:#681A23;
  --sombra:0 1px 2px rgba(0,0,0,.05),0 14px 36px rgba(0,0,0,.07);
  color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--chao);color:var(--tinta);font:17px/1.5 var(--letra);padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto}
a{color:var(--acento);text-underline-offset:3px}
h1,h2,h3{font-family:var(--letra);line-height:1.2;text-wrap:balance;margin:0;letter-spacing:-.02em}
b{font-weight:700}
/* ── A barra do alto: a marca CI8 e o nome, como no app e no site ── */
.barra{display:flex;align-items:center;gap:10px;padding:16px 0 4px;font-weight:700;font-size:15px}
.ci8{width:28px;height:28px;flex:none}
.ci8 .hora{fill:var(--tinta3)}.ci8 .meio-dia{fill:var(--acento)}.ci8 .infinito{stroke:var(--tinta)}
.barra .selo{margin-left:auto;font:600 12px/1 var(--dado);color:var(--tinta3);background:var(--papel2);padding:6px 10px;border-radius:999px}
/* ── O topo da página ── */
.topo{padding:18px 0 8px}
.chapeu{font:700 13px/1.3 var(--letra);letter-spacing:.08em;text-transform:uppercase;color:var(--acento)}
h1{font-size:clamp(27px,7vw,32px);margin-top:8px}
.sub{color:var(--tinta2);margin:10px 0 0;font-size:17px;max-width:60ch}
.leitura{color:var(--tinta3);font:13px/1.4 var(--dado);margin-top:10px}
.numeros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 6px}
@media (min-width:640px){.numeros{grid-template-columns:repeat(4,minmax(0,1fr))}}
.numero{background:var(--papel2);border-radius:20px;padding:12px 14px}
.numero b{display:block;font:700 20px/1.2 var(--dado);font-variant-numeric:tabular-nums}
.numero span{font-size:13px;color:var(--tinta3)}
.trilha{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.trilha a{text-decoration:none;color:var(--tinta);font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--papel2)}
section{margin-top:40px;scroll-margin-top:12px}
h2{font-size:23px;display:flex;align-items:center;gap:10px}
h2 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:999px;background:var(--acento);color:var(--sobre);font:700 14px/1 var(--dado);flex:none}
.intro{color:var(--tinta2);margin:10px 0 0;max-width:62ch;font-size:17px}
small{color:var(--tinta3);font-size:13px}
/* ── O fluxo: blocos sem contorno, ligados por um fio ── */
.fluxo{display:grid;gap:0;margin-top:16px}
.fluxo>*{position:relative}
.fluxo>*+*{margin-top:28px}
.fluxo>*+*::before{content:"";position:absolute;left:26px;top:-28px;height:28px;border-left:2px solid var(--traco)}
.fluxo>*+*::after{content:"";position:absolute;left:21px;top:-9px;border:6px solid transparent;border-top:7px solid var(--traco);border-bottom:0}
.no{background:var(--papel2);border-radius:22px;padding:14px 16px;box-shadow:var(--sombra)}
.no h3{font-size:20px;margin-top:2px}
.no p{margin:6px 0 0;color:var(--tinta2);font-size:15px;line-height:1.5}
.no .quando{font:13px/1.4 var(--dado);color:var(--tinta3);margin-top:8px}
.donos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dono{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--tinta2);background:var(--papel3);padding:3px 10px 3px 3px;border-radius:999px}
.dono i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--cor);color:#000;font:700 11px/1 var(--dado)}
.ponta{display:inline-block;background:var(--tinta);color:var(--chao);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px}
.fim .ponta{background:var(--acento);color:var(--sobre)}
.nota{font-size:15px;color:var(--tinta2);background:var(--acentoFraco);border-radius:20px;padding:12px 14px;margin-left:44px}
.fluxo>.nota::before,.fluxo>.nota::after{display:none}
details{margin-top:10px}
summary{cursor:pointer;font-size:15px;font-weight:700;color:var(--acento);list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--acentoFraco)}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-family:var(--dado)}
details[open]>summary::before{content:"−"}
details ul,details ol{margin:10px 0 0;padding-left:22px;color:var(--tinta2);font-size:15px}
details li+li{margin-top:6px}
/* ── A decisão: o losango e os caminhos no semáforo do app ── */
.decisao{padding:0}
.pergunta{display:flex;align-items:center;gap:12px;background:var(--acentoFraco);border-radius:22px;padding:12px 16px;font-weight:700;font-size:17px}
.pergunta::before{content:"?";display:inline-grid;place-items:center;width:30px;height:30px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--acento);color:var(--sobre);font:800 14px/1 var(--dado);flex:none}
.ramos{display:grid;gap:12px;margin-top:12px;padding-left:18px;border-left:2px solid var(--traco);margin-left:25px}
@media (min-width:700px){.ramos.dois,.ramos.varios{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ramo{min-width:0}
.rotulo{display:inline-block;font:700 12px/1 var(--dado);letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:999px;margin-bottom:8px}
.rotulo.sim{color:var(--bom);background:color-mix(in srgb,var(--bom) 16%,transparent)}
.rotulo.nao{color:var(--erro);background:color-mix(in srgb,var(--erro) 16%,transparent)}
.rotulo.meio{color:var(--atencao);background:color-mix(in srgb,var(--atencao) 16%,transparent)}
.ramo .fluxo{margin-top:0}
.ramo .fluxo>*+*{margin-top:20px}
.ramo .fluxo>*+*::before{top:-20px;height:20px;left:22px}
.ramo .fluxo>*+*::after{top:-8px;left:17px}
/* ── Os blocos de conteúdo ── */
.caixa{background:var(--papel2);border-radius:24px;padding:16px;margin-top:14px}
.caixa h3{font-size:20px;margin-bottom:6px}
.caixa ul{margin:8px 0 0;padding-left:22px;color:var(--tinta2)}
.caixa li+li{margin-top:6px}
.caixa p{color:var(--tinta2);margin:6px 0 0}
.aviso{background:color-mix(in srgb,var(--atencao) 12%,var(--papel2))}
.veredito{background:var(--acentoFraco)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;vertical-align:top}
tbody tr+tr td{box-shadow:0 -1px 0 color-mix(in srgb,var(--tinta) 8%,transparent)}
th{font:700 12px/1.3 var(--dado);color:var(--tinta3);text-transform:uppercase;letter-spacing:.04em}
td.v{font-family:var(--dado);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{min-width:5.5em}
.tabela{overflow-x:auto;background:var(--papel2);border-radius:20px;padding:4px 8px;margin-top:10px}
.caixa .tabela{background:none;padding:0}
.pessoas{display:grid;gap:12px;margin-top:14px}
@media (min-width:640px){.pessoas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pessoa{background:var(--papel2);border-radius:24px;padding:14px 16px;box-shadow:var(--sombra)}
.pessoa h3{font-size:20px;display:flex;align-items:center;gap:10px}
.pessoa h3::before{content:"";width:14px;height:14px;border-radius:999px;background:var(--cor);flex:none}
.pessoa .papel{font-size:13px;color:var(--tinta3);margin-top:2px}
.pessoa dl{margin:10px 0 0;display:grid;gap:6px}
.pessoa dt{font:700 12px/1.3 var(--dado);text-transform:uppercase;letter-spacing:.05em;color:var(--tinta3)}
.pessoa dd{margin:0;font-size:15px;color:var(--tinta2)}
.atalhos{display:grid;gap:10px;margin-top:10px}
@media (min-width:700px){.atalhos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.atalho{background:var(--papel2);border-radius:20px;padding:12px 14px;display:grid;gap:4px}
.atalho b{font-size:15px}
.atalho span{font-size:15px;color:var(--tinta2)}
.atalho small{font-size:13px;color:var(--tinta3)}
.melhorias{margin-top:48px}
.melhoria{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;background:var(--papel2);border-radius:20px;margin-top:8px}
.melhoria code{font:700 13px/1.6 var(--dado);color:var(--corp)}
.melhoria b{font-size:15px}
.melhoria span{grid-column:2;font-size:15px;color:var(--tinta2)}
.melhoria .onde{color:var(--tinta);font-weight:600}
.melhoria .quem{font:600 13px/1.5 var(--dado);color:var(--tinta3)}
.melhoria.no-app b{color:var(--bom)}
.copiar{margin-top:10px;font:700 14px/1 var(--letra);padding:10px 16px;border-radius:999px;border:0;background:var(--acento);color:var(--sobre);cursor:pointer}
.copiavel{white-space:pre-wrap;background:var(--papel3);border-radius:16px;padding:12px 14px;font:14px/1.5 var(--dado);margin-top:8px;overflow-wrap:anywhere}
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.campos label{font-size:13px;color:var(--tinta3);display:grid;gap:4px}
.campos input{font:15px/1.3 var(--dado);padding:10px 14px;border-radius:999px;border:0;background:var(--papel3);color:var(--tinta);min-width:0;width:100%}
.resultado{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.resultado .numero{background:var(--papel3)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;text-decoration:none;background:var(--papel3)}
[hidden]{display:none!important}
/* ── Em 1 minuto: o caminho para a página, nunca no lugar dela ── */
.resumo{background:var(--acentoFraco);border-radius:24px;padding:16px 18px;margin:16px 0 4px}
.resumo-t{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acento);margin:0}
.resumo ol{margin:10px 0 0;padding-left:22px;display:grid;gap:8px}
.resumo li{font-size:17px;line-height:1.45}
.resumo li::marker{font-family:var(--dado);color:var(--acento);font-weight:700}
/* ── Os cenários: a chave e as três saídas ── */
.chave2{display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--papel3);margin:8px 0 4px;max-width:100%}
.chave2 button{border:0;background:none;color:var(--tinta2);font:700 14px/1 var(--letra);padding:10px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.chave2 button[aria-checked="true"]{background:var(--acento);color:var(--sobre)}
.chave2 button:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.chave2.tres{grid-template-columns:repeat(3,1fr)}
.quem{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.quem button{border:0;background:var(--papel2);color:var(--tinta);font:700 15px/1 var(--letra);padding:12px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.quem button[aria-checked="true"]{background:var(--acento);color:var(--sobre)}
.quem button:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.ficha{background:var(--papel2);border-radius:22px;padding:16px 18px;box-shadow:var(--sombra);margin-top:12px;scroll-margin-top:16px}
.ficha-topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ficha-topo i{font-style:normal;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--cor);color:#fff;font-weight:700;font-size:18px;flex:none}
.ficha-topo h3{margin:0;font-size:20px}
.ficha-topo .papel{color:var(--tinta3);font-size:15px}
.ficha-topo>div{min-width:0;flex:1 1 180px}
.ficha .tempo{font:600 13px/1 var(--dado);background:var(--papel3);padding:8px 12px;border-radius:999px}
.ficha .faz{font-size:17px;line-height:1.6;margin:14px 0}
.ficha-fluxo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch;margin:0 0 14px}
.ficha-fluxo>div{background:var(--papel3);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.45;min-width:0}
.ficha-fluxo>div.eu{background:var(--cor);color:#fff;font-weight:700}
.ficha-fluxo span{display:block;font:600 11px/1.2 var(--dado);letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.ficha-fluxo b{align-self:center;color:var(--tinta3)}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:15px;line-height:1.55}
.ficha dt{font:600 12px/1.6 var(--dado);letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3)}
.ficha dd{margin:0;min-width:0}
.ficha dd ol{margin:0;padding-left:20px}
.lista-ferramentas{margin:10px 0 0;padding-left:20px;display:grid;gap:10px}
.lista-ferramentas span{color:var(--tinta2);font-size:15px}
.lista-ferramentas code{font:600 12px/1 var(--dado);color:var(--tinta3)}
.marca{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:16px;line-height:1.5;cursor:pointer}
.marca input{width:22px;height:22px;accent-color:var(--acento);flex:none;margin-top:1px}
.conta-lista{margin-top:10px;font-size:15px}

.campos select{font:15px/1.3 var(--letra);padding:10px 14px;border-radius:999px;border:0;background:var(--papel3);color:var(--tinta);min-width:0;width:100%}
.campo-largo{display:grid;gap:4px;margin-top:12px;font-size:13px;color:var(--tinta3)}
.campo-largo textarea{font:15px/1.5 var(--letra);padding:12px 14px;border-radius:14px;border:0;background:var(--papel3);color:var(--tinta);width:100%;resize:vertical}
@media (max-width:520px){.campos{grid-template-columns:1fr}.chave2.tres button{padding:10px 8px;font-size:13px}}
.investe,.impulso{font-size:15px;color:var(--tinta2);margin:10px 0 0}
.investe span{font:700 12px/1 var(--dado);text-transform:uppercase;letter-spacing:.05em;color:var(--tinta3);margin-right:6px}
.cenario{border-radius:18px;padding:12px 14px;margin-top:10px;background:var(--papel3)}
.cen-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cen-topo b{font:700 13px/1 var(--dado);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;border-radius:999px}
.cenario.pessimista .cen-topo b{color:var(--erro);background:color-mix(in srgb,var(--erro) 16%,transparent)}
.cenario.realista .cen-topo b{color:var(--atencao);background:color-mix(in srgb,var(--atencao) 16%,transparent)}
.cenario.otimista .cen-topo b{color:var(--bom);background:color-mix(in srgb,var(--bom) 16%,transparent)}
.cenario p{margin:8px 0 0;font-size:15px;color:var(--tinta)}
.cenario .perde{color:var(--tinta2)}
.cenario .perde span{font-weight:700}
.aviso-cen{font-size:14px;color:var(--tinta3);margin:12px 0 0}
.rodape{margin-top:40px;color:var(--tinta3);font-size:13px;text-align:center;display:flex;justify-content:center;align-items:center;gap:8px}
.rodape .ci8{width:18px;height:18px}

.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.botao{border:0;font:700 15px/1 var(--letra);padding:14px 18px;border-radius:999px;cursor:pointer;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.botao.cheio{background:var(--acento);color:var(--sobre)}
.botao.vazio{background:var(--papel2);color:var(--tinta)}
.botao[disabled]{opacity:.5;cursor:default}
.situacao{margin-top:12px;font-size:15px;color:var(--tinta2)}
.clausula-p{margin:12px 0 0;max-width:68ch}
.clausula-l{margin:12px 0 0;padding-left:22px;max-width:68ch}
.clausula-l li+li{margin-top:8px}
section .tabela{margin-top:12px}
.assinaturas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:14px}
.cartao{background:var(--papel2);border-radius:22px;padding:16px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:10px;min-width:0}
.cartao h3{font-size:19px}
.cargos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;margin-top:12px}
.cargos .ficha{margin-top:0}
.cartao .titulo-f{font:600 11px/1.3 var(--dado);letter-spacing:.08em;text-transform:uppercase;color:var(--acento);margin-bottom:4px}
.cartao .papel{color:var(--tinta3);font-size:14px}
.folha-assin{background:#FFFFFF;border-radius:14px;height:110px;display:grid;place-items:center;overflow:hidden}
.folha-assin img{max-height:96px;max-width:92%}
.folha-assin.vazia{background:var(--papel3);color:var(--tinta3);font-size:14px}
.quando-assin{font:600 13px/1.4 var(--dado);color:var(--tinta2)}
.refazer{border:0;background:none;color:var(--tinta3);font:600 14px/1 var(--letra);padding:6px 0;cursor:pointer;text-decoration:underline;align-self:flex-start}
.assinador{position:fixed;inset:0;z-index:50;background:var(--chao);display:flex;flex-direction:column;gap:12px;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.assinador h2{font-size:22px}
.assinador p{margin:0;color:var(--tinta2);font-size:15px}
.papel-assin{flex:1;min-height:200px;background:#FFFFFF;border-radius:20px;position:relative;touch-action:none;overflow:hidden}
.papel-assin canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

var alvo=document.getElementById('cofre-alvo'),aviso=document.getElementById('cofre-aviso');
function diz(t){aviso.querySelector('p').textContent=t;aviso.hidden=false}
var chave=null;
try{var m=/chave=([A-Za-z0-9_-]+)/.exec(location.hash);if(m){chave=m[1];localStorage.setItem('chave-do-time',chave)}else{chave=localStorage.getItem('chave-do-time')}}catch(_){var m2=/chave=([A-Za-z0-9_-]+)/.exec(location.hash);chave=m2?m2[1]:null}
if(!chave){diz('Esta página é do time. Abra pelo link que o Davi mandou no grupo.');return}
if(!(window.crypto&&crypto.subtle)){diz('Este navegador não abre a página. Use o Chrome atualizado.');return}
var bruto=atob(document.getElementById('cofre').textContent.trim()),b=new Uint8Array(bruto.length);for(var i=0;i<bruto.length;i++)b[i]=bruto.charCodeAt(i);
crypto.subtle.digest('SHA-256',new TextEncoder().encode(chave)).then(function(h){return crypto.subtle.importKey('raw',h,'AES-GCM',false,['decrypt'])})
.then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12))})
.then(function(claro){
 var t=new TextDecoder().decode(claro);alvo.innerHTML=t;aviso.hidden=true;
 alvo.querySelectorAll('script').forEach(function(s){var n=document.createElement('script');if(s.type)n.type=s.type;if(s.id)n.id=s.id;n.text=s.text;s.replaceWith(n)});
 if(location.hash&&location.hash.length>1&&location.hash.indexOf('chave=')<0){var a=document.getElementById(location.hash.slice(1));if(a)a.scrollIntoView()}
},function(){try{localStorage.removeItem('chave-do-time')}catch(_){}diz('Este link não abre esta página. Peça o link certo ao Davi.')});
})();
</script>
</body>
</html>
