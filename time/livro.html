<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Livro de assinaturas · Termos do time</title>
<style>
:root{
  --chao:#F5F4EE;
  --papel:#FFFFFF;
  --papel2:#ECEAE1;
  --papel3:#E2DFD3;
  --tinta:#1F1E1D;
  --tinta2:#3F3D39;
  --tinta3:#57554F;
  --acento:#C2410C;
  --sobre:#FFFFFF;
  --bom:#15803D;
  --atencao:#D97706;
  --erro:#B91C1C;
  --sombra:0 2px 10px rgba(31,30,29,.06);
  --letra:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --dado:ui-monospace,"Cascadia Code","Source Code Pro",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--chao);color:var(--tinta);font:16px/1.55 var(--letra);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:860px;margin:0 auto}
a{color:var(--acento);font-weight:600}
.barra{display:flex;align-items:center;gap:10px;font:700 14px/1 var(--letra);padding:8px 0 18px}
.barra svg{width:22px;height:22px;flex:none}
.barra .selo{margin-left:auto;font:700 11px/1 var(--dado);letter-spacing:.08em;background:var(--papel2);padding:6px 10px;border-radius:999px;color:var(--tinta2)}
.topo{background:var(--papel);border-radius:24px;padding:22px 20px;box-shadow:var(--sombra)}
.topo .chapeu{font:700 12px/1.2 var(--dado);letter-spacing:.08em;text-transform:uppercase;color:var(--acento)}
.topo h1{margin:8px 0 6px;font-size:clamp(24px,5vw,34px);line-height:1.15}
.topo .sub{margin:0 0 10px;color:var(--tinta2);max-width:65ch}
.caixa{background:var(--papel2);border-radius:22px;padding:16px 18px;box-shadow:var(--sombra);margin-top:14px}
.caixa h3{margin:0 0 8px;font-size:18px}
.caixa ul{margin:8px 0 0;padding-left:20px}
.caixa li+li{margin-top:6px}
.livro-doc{background:var(--papel2);border-radius:22px;padding:16px 18px;box-shadow:var(--sombra);margin-top:14px}
.livro-doc header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
.livro-doc h3{margin:0;font-size:20px;flex:1;min-width:0}
.livro-doc .ordem{font:600 12px/1 var(--dado);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.livro-doc .ver{font:600 13px/1 var(--dado);background:var(--papel3);padding:7px 11px;border-radius:999px}
.barrinha{height:10px;border-radius:999px;background:var(--papel3);margin:12px 0 4px;overflow:hidden}
.barrinha i{display:block;height:100%;background:var(--bom);border-radius:999px}
.conta{font-size:15px;color:var(--tinta2);margin:8px 0 0}
.linhas{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.linhas li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--papel3);border-radius:16px;padding:10px 12px;font-size:16px}
.linhas li b{min-width:96px}
.linhas .sit{font-size:14px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--papel2);color:var(--tinta2)}
.linhas .sit.ok{background:var(--bom);color:#fff}
.linhas .sit.velha{background:var(--papel2);color:var(--tinta)}
.mini-assin{margin-left:auto;background:#FFFFFF;border-radius:10px;padding:3px 8px;display:inline-flex;align-items:center}
.mini-assin img{max-height:32px;max-width:110px}
.tudo-pronto{background:var(--bom);color:#fff;border-radius:22px;padding:16px 18px;font-size:18px;font-weight:700;margin-top:14px}
.rodape{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--tinta3);font-size:14px;margin:26px 0 8px}
.rodape svg{width:18px;height:18px}
</style>
</head>
<body>
<main id="livro"></main>
<script type="application/json" id="config">
{
  "url": "https://jezpnlmckokrshwamltg.supabase.co",
  "anon_partes": [
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9",
    "eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplenBubG1ja29rcnNod2FtbHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NjcxMDYsImV4cCI6MjEwMjQ0MzEwNn0",
    "nPE850-JxVYL7ClJCGJJjY_F6-3qZS8QHjRoVoNtBo0"
  ],
  "marca": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z\"/></svg>",
  "nomes": [
    "Erisvaldo",
    "Davi",
    "Valéria",
    "Ricardo",
    "Erlane",
    "Júlio"
  ],
  "docs": [
    {
      "id": "funcoes",
      "titulo": "Os fundadores e as funções",
      "versao": "v1 · B42E66",
      "arquivo": "funcoes.html"
    },
    {
      "id": "acordo",
      "titulo": "O nosso acordo",
      "versao": "v1 · 61EB89",
      "arquivo": "acordo.html"
    }
  ]
}
</script>
<script>
(function(){
var C=JSON.parse(document.getElementById('config').textContent);
var chavePub=(C.anon_partes||[]).join('.');
var raiz=document.getElementById('livro');
var chave=null;
try{
 var m=/chave=([A-Za-z0-9_-]+)/.exec(location.hash);
 if(m){chave=m[1];localStorage.setItem('chave-do-time',chave)}
 else{chave=localStorage.getItem('chave-do-time')||''}
}catch(_){
 var m2=/chave=([A-Za-z0-9_-]+)/.exec(location.hash);
 chave=m2?m2[1]:'';
}
var assinaturasPorDoc={funcoes:{},acordo:{}};
var avisoEstado='Consultando assinaturas…';
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dataHora(iso){
 if(!iso)return '';
 var d=new Date(iso);if(isNaN(d.getTime()))return '';
 var p=function(n){return ('0'+n).slice(-2)};
 return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' às '+p(d.getHours())+':'+p(d.getMinutes());
}
function situacao(doc,nome){
 var mapa=assinaturasPorDoc[doc.id]||{};
 var reg=mapa[nome];
 if(!reg)return {cls:'',txt:'Falta assinar',img:''};
 if(reg.versao===doc.versao){
  var q=dataHora(reg.assinado_em);
  return {cls:'ok',txt:q?('Assinou em '+q):'Assinado',img:reg.assinatura||''};
 }
 return {cls:'velha',txt:'Assinou a versão anterior ('+reg.versao+'): falta a nova',img:''};
}
function desenha(){
 var h='<div class="barra">'+C.marca+'<span>Canvas Infinito</span><span class="selo">LIVRO DO TIME</span></div>'
 +'<header class="topo"><div class="chapeu">Guia do time · registro vivo</div><h1>Livro de assinaturas</h1>'
 +'<p class="sub">Quem já assinou cada termo do time, em que versão e quando — sincronizado com o aplicativo e com o site do time.</p>'
 +'<p class="conta" id="aviso-sincronia" aria-live="polite">'+esc(avisoEstado)+'</p></header>';
 var total=0,feitas=0;
 C.docs.forEach(function(d,i){
  var linhas='',n=0;
  C.nomes.forEach(function(nome){
   var s=situacao(d,nome);if(s.cls==='ok')n++;
   var mini=s.img&&s.img.indexOf('data:image/png;base64,')===0?'<span class="mini-assin"><img alt="Assinatura de '+esc(nome)+'" src="'+esc(s.img)+'"></span>':'';
   linhas+='<li><b>'+esc(nome)+'</b><span class="sit '+s.cls+'">'+esc(s.txt)+'</span>'+mini+'</li>';
  });
  total+=C.nomes.length;feitas+=n;
  var href=chave?(d.arquivo+'#chave='+encodeURIComponent(chave)):d.arquivo;
  h+='<section class="livro-doc"><header><span class="ordem">'+(i+1)+'º termo</span></header>'
  +'<header><h3>'+esc(d.titulo)+'</h3><span class="ver">'+esc(d.versao)+'</span></header>'
  +'<div class="barrinha" role="img" aria-label="'+n+' de '+C.nomes.length+' assinaturas"><i style="width:'+(n/C.nomes.length*100)+'%"></i></div>'
  +'<p class="conta"><b>'+n+' de '+C.nomes.length+'</b> assinaturas · <a href="'+esc(href)+'">Abrir este termo</a></p>'
  +'<ul class="linhas">'+linhas+'</ul></section>';
 });
 if(feitas===total&&total>0){
  h+='<p class="tudo-pronto">Todas as doze assinaturas estão registradas nas versões atuais. O time pode começar.</p>';
 }
 h+='<section class="caixa"><h3>Assinar direto no aplicativo</h3><ul>'
 +'<li>No aplicativo Canvas Infinito, abra Finanças → Time → Os termos do time → «Ler e assinar».</li>'
 +'<li>Membros autenticados leem e desenham a assinatura direto na tela, sem precisar colar chave nem abrir navegador externo.</li></ul></section>'
 +'<p class="rodape">'+C.marca+'<span>Do nosso time, para o nosso time.</span></p>';
 raiz.innerHTML=h;
}
function rpc(docId){
 return fetch(C.url+'/rest/v1/rpc/time_assinaturas',{
  method:'POST',
  headers:{'apikey':chavePub,'Authorization':'Bearer '+chavePub,'Content-Type':'application/json'},
  body:JSON.stringify({p_chave:chave||'',p_documento:docId})
 }).then(function(r){
  return r.text().then(function(t){
   var j=null;try{j=JSON.parse(t)}catch(_){}
   if(!r.ok){var msg=(j&&(j.message||j.hint))||t||('erro '+r.status);throw new Error(msg)}
   return j||[];
  });
 });
}
function consolidar(doc,lista){
 var mapa={};
 (lista||[]).forEach(function(r){
  if(!r||!r.nome)return;
  var ant=mapa[r.nome];
  if(!ant){mapa[r.nome]=r;return}
  var rAtual=r.versao===doc.versao,aAtual=ant.versao===doc.versao;
  if(rAtual&&!aAtual){mapa[r.nome]=r;return}
  if(!rAtual&&aAtual)return;
  if(new Date(r.assinado_em)>new Date(ant.assinado_em))mapa[r.nome]=r;
 });
 assinaturasPorDoc[doc.id]=mapa;
}
if(!chave){
 avisoEstado='Abra pelo link do time (#chave=…) para consultar as assinaturas aqui no navegador, ou confira direto no aplicativo autenticado.';
 desenha();
}else{
 desenha();
 Promise.all(C.docs.map(function(d){return rpc(d.id).then(function(l){consolidar(d,l)})})).then(function(){
  avisoEstado='Livro sincronizado com o servidor do time.';
  desenha();
 },function(err){
  avisoEstado=/chave_errada/.test(err.message)?'A chave do link não confere. Confira no aplicativo ou peça o link atualizado ao Davi.':'Não foi possível consultar o servidor agora ('+err.message+').';
  desenha();
 });
}
})();
</script>
</body>
</html>
